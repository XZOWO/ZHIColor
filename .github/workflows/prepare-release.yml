name: Prepare signed release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: release
    env:
      ZHICOLOR_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ZHICOLOR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ZHICOLOR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Load release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$ZHICOLOR_STORE_PASSWORD"
          test -n "$ZHICOLOR_KEY_ALIAS"
          test -n "$ZHICOLOR_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ZHICOLOR_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: chmod +x gradlew
      - run: ./gradlew :bridge-core:testDebugUnitTest :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --console=plain
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Prepare release attachments
        run: |
          python scripts/prepare_release.py --apk app/build/outputs/apk/release/app-release.apk --output release-assets --changelog-file docs/release/CHANGELOG.md
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-assets
          path: release-assets/*
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
