name: Sync release assets
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag
        required: true
permissions:
  contents: read
concurrency:
  group: release-assets-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      CLOUD_BASE_URL: ${{ vars.CLOUD_BASE_URL }}
      OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      OSS_PREFIX: zhicolor
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - name: Check cloud sync configuration
        id: cloud
        run: |
          if [ -z "$CLOUD_BASE_URL" ]; then
            echo "SYNC_SKIPPED: cloud update is not configured"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.cloud.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.cloud.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - name: Download stable release attachments
        if: steps.cloud.outputs.enabled == 'true'
        run: |
          test -n "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Stable release required") else "stable" end'
          gh release download "$RELEASE_TAG" --dir release-assets --pattern '*.apk' --pattern update.json --pattern SHA256SUMS
      - run: python -m pip install oss2==2.19.1
        if: steps.cloud.outputs.enabled == 'true'
      - name: Synchronize verified attachments
        if: steps.cloud.outputs.enabled == 'true'
        run: python scripts/mirror_release.py --assets release-assets --tag "$RELEASE_TAG" --expected-base-url "$CLOUD_BASE_URL"
